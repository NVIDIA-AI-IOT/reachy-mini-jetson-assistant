# Optional conservative hardware bring-up overlay for JetPack 7.2.
# The base config already defaults to JetPack 7.2. Use this profile to disable
# body assist and scanning during initial connected-Reachy validation.

stt:
  device: "cuda"
  compute_type: "float16"

audio:
  input_device: "Reachy Mini Audio"
  output_device: "Reachy Mini Audio"
  echo_cancellation: true

reachy:
  enabled: true
  spawn_daemon: true
  wake_on_start: true
  sleep_on_exit: true
  face_tracking: true
  # Keep face detection/dashboard telemetry active without driving the motors.
  tracking_motion_enabled: false
  # Faster head-only visual tracking for Orin Nano. The camera remains at the
  # base 10 FPS; larger bounded corrections improve motion without repeatedly
  # processing duplicate frames or changing the conservative travel limits.
  tracking_head_yaw_gain: 24.0
  tracking_head_yaw_step: 2.0
  tracking_soft_center_head_yaw_step: 1.1
  tracking_pose_smoothing: 0.28
  # Motion tuning remains available for opt-in tracking, but body scanning and
  # assistance stay disabled for conservative hardware operation.
  tracking_body_enabled: false
  tracking_scan_enabled: false
  speaking_movements_enabled: false

rag:
  enabled: false
